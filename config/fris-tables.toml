  ["person_external", "person/external"],
  ["person_provider", "person/dataProvider"],
  ["organisation", "organisation@uuid"],
  ["organisation_external", "organisation/external"],
  ["assignments", "count(assignment)"],
  ["assign_person", "assignment/person@uuid"],
  ["assign_org", "assignment/organisation@uuid"],
  ["assign_org_root", "assignment/organisation/rootOrganisationUuid"],
  ["person_first_name", "person/name/firstName|assignment/person/name/firstName"],
  ["person_last_name", "person/name/lastName|assignment/person/name/lastName"],
