threads = 8
winner_rows = 2000000

[[tables]]
name = "ro"
entity = "research_output"
rows = "."
columns = [
  ["kind", "name()"],
  ["data_provider", "dataProvider"],
  ["data_provider_id", "dataProviderId"],
  ["external", "external"],
  ["hidden", "hidden"],
  ["state", "state"],
  ["created", "created"],
  ["last_modified", "lastModified"],
  ["last_provider_update", "lastDataProviderUpdate"],
  ["root_org", "rootOrganisationUuid"],
  ["publication_date", "publicationDate"],
  ["publication_year", "publicationYear"],
  ["type", "researchOutput/associationType@term"],
  ["type_parent", "researchOutput/associationType/parent"],
  ["referee", "refereeType@term"],
  ["status", "publicationStatus@term"],
  ["open_access", "open_access_label/associationType@term"],
  ["collaboration", "collaboration/associationType@term"],
  ["language", "originalLanguage@term"],
  ["title_en", "title/texts/text[@locale=en]"],
  ["title_nl", "title/texts/text[@locale=nl]"],
  ["title_any", "title/texts/text"],
  ["journal", "journal@uuid"],
  ["journal_issn", "journal/issn"],
  ["journal_volume", "journalVolume"],
  ["journal_issue", "journalIssue"],
  ["book_title", "bookTitle"],
  ["isbn", "ISBN"],
  ["pages", "pages"],
  ["doi", "sources/source[@authority=DOI]"],
  ["unpaywall_doi", "unpaywallDoi/doi"],
  ["patent_number", "patentNumber"],
  ["abstract_en", "researchAbstract/texts/text[@locale=en]"],
  ["participants", "count(participants/participant)"],
  ["projects", "count(researchOutputProjects/researchOutputProject)"],
]

[[tables]]
name = "ro_source"
